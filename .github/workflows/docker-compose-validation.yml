name: Docker Compose validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/MAG-31-MAG-32-docker-setup
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'README.md'
      - '.github/workflows/docker-compose-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - name: Checkout SecurePay
        uses: actions/checkout@v4
        with:
          path: SecurePay

      - name: Checkout ecosystem repositories
        uses: actions/checkout@v4
        with:
          repository: SecurePay-Riwi/securepay-apis
          ref: feat/MAG-31-MAG-32-docker-setup
          path: securepay-apis
      - uses: actions/checkout@v4
        with:
          repository: SecurePay-Riwi/securepay-csv
          ref: feat/MAG-31-MAG-32-docker-setup
          path: securepay-csv
      - uses: actions/checkout@v4
        with:
          repository: SecurePay-Riwi/securepay-seed
          ref: feat/MAG-31-MAG-32-docker-setup
          path: securepay-seed
      - uses: actions/checkout@v4
        with:
          repository: SecurePay-Riwi/securepay-generator
          ref: feat/MAG-31-MAG-32-docker-setup
          path: securepay-generator

      - name: Validate Compose configuration
        working-directory: SecurePay
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN || 'ci-placeholder-token' }}
        run: docker compose config --quiet

      - name: Build all component images
        working-directory: SecurePay
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN || 'ci-placeholder-token' }}
        run: docker compose build

      - name: Start ecosystem and inspect service logs
        if: ${{ env.LOCALSTACK_AUTH_TOKEN != '' }}
        working-directory: SecurePay
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color --tail=200 || true
            docker compose down -v || true
          }
          trap cleanup EXIT
          docker compose up -d
          docker compose ps
          for attempt in $(seq 1 30); do
            if docker compose ps --status running | grep -q decision-engine; then
              break
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color --tail=200
