[project]
name = "securepay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "awslambdaric>=4.2.3",
    "boto3>=1.43.113",
    "faker>=40.43.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "kaggle>=2.2.4",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "valkey>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
spark = [
    "pyspark>=4.1.1,<4.2",
]

[tool.uv]
# uv sync and uv run bring pyspark for the reconciliation match (HU-37);
# the Docker image does not (Dockerfile: --no-default-groups).
default-groups = ["dev", "spark"]

[tool.ruff]
# Lint only (no formatter yet). More rule families (I, UP, B) can be added
# later in their own PR, so the PRs that are open now get no conflicts.
target-version = "py312"
extend-exclude = ["doc-website"]

[tool.ruff.lint]
# Written out so a newer ruff with other defaults does not change the
# result: pycodestyle (E, W), real errors (F), import order (I), Python 3.12
# syntax (UP) and likely bugs (bugbear, B).
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length: left to the formatter
    "UP042",  # StrEnum changes what str() of a member returns
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in a default argument.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Header", "fastapi.Path", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services", "tests", "shared"]
markers = [
    "integracion: necesita LocalStack levantado (se salta sola si no está)",
]
