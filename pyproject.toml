[project]
name = "securepay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "awslambdaric>=4.2.3",
    "boto3>=1.43.113",
    "faker>=40.43.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "kaggle>=2.2.4",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "valkey>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
spark = [
    "pyspark>=4.1.1,<4.2",
]

[tool.uv]
# uv sync and uv run bring pyspark for the reconciliation match (HU-37);
# the Docker image does not (Dockerfile: --no-default-groups).
default-groups = ["dev", "spark"]

[tool.ruff]
# Lint only (no formatter yet). More rule families (I, UP, B) can be added
# later in their own PR, so the PRs that are open now get no conflicts.
target-version = "py312"
extend-exclude = ["doc-website"]

[tool.ruff.lint]
# Real errors (F) and the serious pycodestyle checks (E4, E7, E9), written
# out so a newer ruff with other defaults does not change the result.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services", "tests", "shared"]
markers = [
    "integracion: necesita LocalStack levantado (se salta sola si no está)",
]
